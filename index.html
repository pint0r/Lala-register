.app { max-width: 560px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; background: #F1F5F9; overflow: hidden; }

/* HEADER */
.hdr { background: #fff; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1.5px solid #E2E8F0; box-shadow: 0 1px 8px rgba(0,0,0,.06); flex-shrink: 0; }
.hdr-sub { font-size: 10px; letter-spacing: 3px; color: #94A3B8; font-weight: 700; }
.hdr-title { font-size: 22px; font-weight: 900; color: #0F172A; }
.hdr-btn { background: #F1F5F9; border: 1.5px solid #E2E8F0; border-radius: 12px; padding: 8px 14px; color: #334155; font-size: 13px; font-weight: 700; }

/* TOP BAR (sub screens) */
.topbar { background: #fff; padding: 12px 18px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1.5px solid #E2E8F0; box-shadow: 0 1px 8px rgba(0,0,0,.06); flex-shrink: 0; }
.topbar-title { font-size: 17px; font-weight: 900; color: #0F172A; }
.back-btn { background: #F1F5F9; border: 1.5px solid #E2E8F0; border-radius: 10px; padding: 7px 14px; font-size: 13px; font-weight: 700; color: #334155; }

/* SPLIT */
.split { display: flex; flex: 1; overflow: hidden; }

/* LEFT */
.left { width: 35%; background: #F1F5F9; display: flex; flex-direction: column; gap: 10px; padding: 14px 10px; overflow-y: auto; border-right: 1.5px solid #E2E8F0; }
.pbtn { background: #fff; border: 2px solid #E2E8F0; border-radius: 16px; padding: 14px 8px; display: flex; flex-direction: column; align-items: center; gap: 5px; position: relative; transition: all .15s; width: 100%; }
.pbtn:active { transform: scale(0.93); }
.pbtn.active { border-color: var(--c); background: var(--bg); box-shadow: 0 4px 14px var(--glow); }
.pbtn-emoji { font-size: 34px; line-height: 1; }
.pbtn-name { font-size: 11px; font-weight: 800; color: #0F172A; text-align: center; line-height: 1.25; }
.pbtn-price { color: #fff; border-radius: 20px; padding: 3px 12px; font-size: 13px; font-weight: 900; }
.pbtn-badge { position: absolute; top: -9px; right: -9px; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 900; color: #fff; }

/* RIGHT */
.right { width: 65%; background: #fff; display: flex; flex-direction: column; }
.order-hdr { padding: 10px 14px 8px; border-bottom: 1px solid #E2E8F0; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.order-lbl { font-size: 11px; font-weight: 800; color: #94A3B8; letter-spacing: 1.5px; }
.clr-btn { background: #FEF2F2; border: 1.5px solid #FECACA; border-radius: 8px; padding: 3px 10px; color: #DC2626; font-size: 11px; font-weight: 700; }
.order-list { flex: 1; overflow-y: auto; padding: 10px 12px; background: #F8FAFC; }
.empty { text-align: center; padding: 28px 8px; color: #CBD5E1; font-size: 12px; line-height: 1.7; }
.citem { background: #fff; border-radius: 14px; padding: 10px 12px; border: 1.5px solid #E2E8F0; display: flex; align-items: center; gap: 8px; margin-bottom: 8px; border-left-width: 4px; }
.citem-emoji { font-size: 20px; }
.citem-info { flex: 1; min-width: 0; }
.citem-name { font-size: 12px; font-weight: 800; color: #0F172A; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.citem-each { font-size: 10px; color: #94A3B8; }
.qty-wrap { display: flex; align-items: center; background: #F1F5F9; border-radius: 9px; border: 1px solid #E2E8F0; overflow: hidden; }
.qty-btn { width: 28px; height: 28px; background: none; border: none; color: #334155; font-size: 17px; font-weight: 900; }
.qty-n { font-size: 13px; font-weight: 900; color: #0F172A; padding: 0 6px; }
.citem-total { font-size: 13px; font-weight: 900; min-width: 40px; text-align: right; }
.order-foot { padding: 12px 14px 18px; border-top: 1.5px solid #E2E8F0; background: #fff; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.tot-lbl { font-size: 10px; color: #94A3B8; font-weight: 800; letter-spacing: 1.5px; }
.tot-amt { font-size: 26px; font-weight: 900; color: #0F172A; line-height: 1.1; }
.charge-btn { flex: 1; border: none; border-radius: 14px; padding: 15px 10px; font-size: 15px; font-weight: 900; transition: all .3s; }
.charge-btn.on { background: linear-gradient(135deg,#F97316,#FB923C); color: #fff; box-shadow: 0 6px 20px rgba(249,115,22,.32); }
.charge-btn.off { background: #F1F5F9; color: #94A3B8; }

/* PAY SCREEN */
.pay-body { flex: 1; overflow-y: auto; padding: 14px 16px 40px; display: flex; flex-direction: column; gap: 12px; }
.duo { display: flex; gap: 10px; }
.tcard { flex: 1; background: #fff; border-radius: 18px; padding: 14px 16px; border: 1.5px solid #E2E8F0; text-align: center; position: relative; }
.tcard-lbl { font-size: 10px; color: #94A3B8; letter-spacing: 2px; font-weight: 800; }
.tcard-val { font-size: 34px; font-weight: 900; color: #0F172A; }
.clr-paid { position: absolute; top: 8px; right: 8px; background: #F1F5F9; border: none; border-radius: 8px; padding: 2px 8px; font-size: 12px; color: #334155; }
.chgbox { border-radius: 18px; padding: 18px 20px; text-align: center; transition: all .4s; }
.chgbox.wait { background: #fff; border: 1.5px solid #E2E8F0; }
.chgbox.go { background: linear-gradient(135deg,#FEF3C7,#FDE68A); border: 1.5px solid #FCD34D; box-shadow: 0 8px 24px rgba(245,158,11,.22); }
.chg-hint { font-size: 14px; color: #94A3B8; padding: 6px 0; }
.chg-cta { font-size: 11px; font-weight: 800; color: #92400E; letter-spacing: 1.5px; }
.chg-amt { font-size: 52px; font-weight: 900; color: #B45309; line-height: 1.1; }
.mlbl { font-size: 11px; font-weight: 800; color: #94A3B8; letter-spacing: 2px; }
.mgrid { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; }
.mbtn { border-radius: 14px; padding: 12px 4px; display: flex; flex-direction: column; align-items: center; gap: 3px; transition: transform .12s; border: 2px solid; }
.mbtn:active { transform: scale(0.91); }
.mbtn.bill { background: #F0FDF4; border-color: #86EFAC; box-shadow: 0 3px 10px rgba(22,163,74,0.15); }
.mbtn.coin { background: #FFFBEB; border-color: #FCD34D; box-shadow: 0 3px 10px rgba(180,83,9,0.15); }
.mico { font-size: 24px; }
.mval-b { font-size: 14px; font-weight: 900; color: #166534; }
.mval-c { font-size: 14px; font-weight: 900; color: #92400E; }
.done-btn { border: none; border-radius: 18px; padding: 18px; font-size: 18px; font-weight: 900; transition: all .3s; }
.done-btn.on { background: linear-gradient(135deg,#16A34A,#4ADE80); color: #fff; box-shadow: 0 8px 24px rgba(22,163,74,.28); }
.done-btn.off { background: #E2E8F0; color: #94A3B8; cursor: not-allowed; }

/* RECEIPT */
.rcpt-wrap { flex: 1; overflow-y: auto; display: flex; flex-direction: column; align-items: center; padding: 36px 20px 28px; background: linear-gradient(160deg,#EFF6FF 0%,#F0FDF4 100%); }
.rcpt-icon { font-size: 68px; line-height: 1; margin-bottom: 10px; }
.rcpt-title { font-size: 30px; font-weight: 900; color: #0F172A; }
.rcpt-sub { font-size: 14px; color: #94A3B8; margin-bottom: 24px; }
.rcpt-card { background: #fff; border-radius: 22px; width: 100%; max-width: 340px; padding: 22px; box-shadow: 0 16px 48px rgba(0,0,0,.12); position: relative; overflow: hidden; border: 1.5px solid #E2E8F0; }
.rcpt-stripe { position: absolute; top: 0; left: 0; right: 0; height: 6px; background: repeating-linear-gradient(90deg,#F97316 0 12px,#8B5CF6 12px 24px,#0EA5E9 24px 36px); }
.rcpt-shop { font-size: 11px; letter-spacing: 3px; color: #94A3B8; font-weight: 700; text-align: center; margin-top: 8px; }
.rcpt-time { font-size: 12px; color: #94A3B8; text-align: center; margin-bottom: 14px; }
.rcpt-row { display: flex; justify-content: space-between; font-size: 14px; padding: 5px 0; border-bottom: 1px solid #E2E8F0; color: #334155; }
.rcpt-tot { display: flex; justify-content: space-between; font-size: 20px; font-weight: 900; padding: 12px 0 6px; color: #0F172A; }
.rcpt-paid { display: flex; justify-content: space-between; font-size: 13px; color: #94A3B8; padding: 3px 0; }
.rcpt-chg { display: flex; justify-content: space-between; font-size: 17px; font-weight: 900; background: #FFFBEB; border: 1.5px solid #FDE68A; border-radius: 12px; padding: 12px 14px; margin-top: 12px; }
.new-btn { margin-top: 26px; background: linear-gradient(135deg,#F97316,#FB923C); color: #fff; border: none; border-radius: 18px; padding: 16px 52px; font-size: 18px; font-weight: 900; box-shadow: 0 8px 24px rgba(249,115,22,.35); }
.rep-btn { margin-top: 12px; background: transparent; color: #94A3B8; border: none; font-size: 13px; }

/* SALES */
.sales-wrap { flex: 1; overflow-y: auto; display: flex; flex-direction: column; background: #F1F5F9; }
.stats-row { padding: 14px 16px 0; display: flex; gap: 10px; }
.stat-card { flex: 1; background: #fff; border-radius: 16px; padding: 18px 12px; text-align: center; border: 1.5px solid #E2E8F0; }
.stat-val { font-size: 30px; font-weight: 900; }
.stat-lbl { font-size: 11px; color: #94A3B8; margin-top: 3px; }
.sales-list { padding: 12px 16px 40px; display: flex; flex-direction: column; gap: 10px; }
.sale-card { background: #fff; border-radius: 16px; padding: 14px; border: 1.5px solid #E2E8F0; }
.sale-hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.sale-badge { background: #F97316; color: #fff; border-radius: 20px; padding: 3px 12px; font-size: 12px; font-weight: 700; }
.sale-time { color: #94A3B8; font-size: 12px; }
.sale-row { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; color: #334155; }
.sale-tot { border-top: 1px dashed #E2E8F0; margin-top: 8px; padding-top: 8px; display: flex; justify-content: space-between; font-weight: 800; font-size: 15px; color: #16A34A; }
.no-sales { text-align: center; padding: 40px; color: #94A3B8; }

<body>
<div class="app" id="app"></div>
<script>
  const PRODUCTS = [
    { id:"3dp_big",  name:"Big 3D Print",          emoji:"🏰", price:5.00, cat:"3d"       },
    { id:"3dp_sml",  name:"Small 3D Print",         emoji:"🦕", price:3.00, cat:"3d"       },
    { id:"bracelet", name:"Rainbow Loom Bracelet",  emoji:"🌈", price:5.00, cat:"bracelet" },
    { id:"origami",  name:"Origami",                emoji:"🐦", price:2.00, cat:"origami"  },
  ];
  const CATS = {
    "3d":      { c:"#F97316", bg:"#FFF7ED", glow:"rgba(249,115,22,0.18)" },
    "origami": { c:"#0EA5E9", bg:"#F0F9FF", glow:"rgba(14,165,233,0.18)" },
    "bracelet":{ c:"#8B5CF6", bg:"#F5F3FF", glow:"rgba(139,92,246,0.18)" },
  };
  const BILLS = [{v:20,l:"$20"},{v:10,l:"$10"},{v:5,l:"$5"},{v:1,l:"$1"}];
  const COINS = [{v:0.25,l:"25¢"},{v:0.10,l:"10¢"},{v:0.05,l:"5¢"},{v:0.01,l:"1¢"}];

let cart=[], paid=0, screen=“shop”, sales=[], salesOpen=false;

const fmt = n => “$”+n.toFixed(2);
const getTotal = () => cart.reduce((s,i)=>s+i.price*i.qty,0);
const getChange = () => Math.max(0, paid - getTotal());
const getCanPay = () => paid > 0 && paid >= getTotal();

function render() {
const app = document.getElementById(“app”);
app.innerHTML = “”;
if (salesOpen) { buildSales(app); return; }
if (screen===“receipt”) { buildReceipt(app); return; }
if (screen===“pay”) { buildPay(app); return; }
buildShop(app);
}

function div(cls, html) {
const d = document.createElement(“div”);
if (cls) d.className = cls;
if (html) d.innerHTML = html;
return d;
}
function btn(cls, text, onClick) {
const b = document.createElement(“button”);
b.className = cls;
b.innerHTML = text;
b.addEventListener(“click”, onClick);
return b;
}
function span(cls, text) {
const s = document.createElement(“span”);
if (cls) s.className = cls;
s.textContent = text;
return s;
}

function buildTopBar(app, title, onBack) {
const bar = div(“topbar”);
bar.appendChild(btn(“back-btn”, “← Back”, onBack));
bar.appendChild(div(“topbar-title”, title));
bar.appendChild(div(””, “”));
app.appendChild(bar);
}

function buildShop(app) {
// Header
const hdr = div(“hdr”);
const hdrLeft = div(””);
hdrLeft.appendChild(div(“hdr-sub”, “3RD GRADE BOOK FAIR”));
hdrLeft.appendChild(div(“hdr-title”, “🛍️ Lala’s Register”));
hdr.appendChild(hdrLeft);
hdr.appendChild(btn(“hdr-btn”, “📊 Sales”, ()=>{ salesOpen=true; render(); }));
app.appendChild(hdr);

```
const split = div("split");

// LEFT — products
const left = div("left");
for (const p of PRODUCTS) {
  const m = CATS[p.cat];
  const inCart = cart.find(i=>i.id===p.id);
  const pb = document.createElement("button");
  pb.className = "pbtn" + (inCart ? " active" : "");
  pb.style.setProperty("--c", m.c);
  pb.style.setProperty("--bg", m.bg);
  pb.style.setProperty("--glow", m.glow);

  if (inCart) {
    const badge = div("pbtn-badge", String(inCart.qty));
    badge.style.background = m.c;
    badge.style.boxShadow = "0 2px 6px "+m.glow;
    pb.appendChild(badge);
  }
  pb.appendChild(div("pbtn-emoji", p.emoji));
  pb.appendChild(div("pbtn-name", p.name));
  const pp = div("pbtn-price", fmt(p.price));
  pp.style.background = m.c;
  pb.appendChild(pp);
  pb.addEventListener("click", ()=>{
    const ex = cart.find(i=>i.id===p.id);
    if (ex) cart = cart.map(i=>i.id===p.id?{...i,qty:i.qty+1}:i);
    else cart = [...cart, {...p, qty:1}];
    render();
  });
  left.appendChild(pb);
}
split.appendChild(left);

// RIGHT — order
const right = div("right");
const ohdr = div("order-hdr");
ohdr.appendChild(div("order-lbl", "🛒 CURRENT ORDER"));
if (cart.length > 0) ohdr.appendChild(btn("clr-btn","🗑 Clear",()=>{ cart=[]; render(); }));
right.appendChild(ohdr);

const olist = div("order-list");
if (cart.length === 0) {
  olist.appendChild(div("empty", "Tap an item to get started!"));
} else {
  for (const item of cart) {
    const m = CATS[item.cat];
    const row = div("citem");
    row.style.borderLeftColor = m.c;
    row.appendChild(div("citem-emoji", item.emoji));
    const info = div("citem-info");
    info.appendChild(div("citem-name", item.name));
    info.appendChild(div("citem-each", fmt(item.price)+" each"));
    row.appendChild(info);
    const qw = div("qty-wrap");
    const mb = btn("qty-btn","−",()=>{ if(item.qty===1) cart=cart.filter(i=>i.id!==item.id); else cart=cart.map(i=>i.id===item.id?{...i,qty:i.qty-1}:i); render(); });
    const pb2 = btn("qty-btn","+",()=>{ cart=cart.map(i=>i.id===item.id?{...i,qty:i.qty+1}:i); render(); });
    qw.appendChild(mb);
    qw.appendChild(div("qty-n", String(item.qty)));
    qw.appendChild(pb2);
    row.appendChild(qw);
    const tot = div("citem-total", fmt(item.price*item.qty));
    tot.style.color = m.c;
    row.appendChild(tot);
    olist.appendChild(row);
  }
}
right.appendChild(olist);

const t = getTotal();
const foot = div("order-foot");
const totDiv = div("");
totDiv.appendChild(div("tot-lbl","TOTAL"));
totDiv.appendChild(div("tot-amt", fmt(t)));
foot.appendChild(totDiv);
const cb = btn("charge-btn "+(cart.length>0?"on":"off"), cart.length>0?"💳 Charge "+fmt(t):"Add Items First", ()=>{ if(cart.length>0){ screen="pay"; render(); } });
foot.appendChild(cb);
right.appendChild(foot);

split.appendChild(right);
app.appendChild(split);
```

}

function buildPay(app) {
buildTopBar(app, “💳 Take Payment”, ()=>{ screen=“shop”; render(); });
const body = div(“pay-body”);
const t = getTotal();
const c = getChange();
const cp = getCanPay();

```
// Duo cards
const duo = div("duo");
const tc1 = div("tcard");
tc1.appendChild(div("tcard-lbl","TOTAL DUE"));
const v1 = div("tcard-val", fmt(t));
tc1.appendChild(v1);
duo.appendChild(tc1);

const tc2 = div("tcard");
tc2.style.background = cp ? "#F0FDF4" : "#fff";
tc2.style.border = "1.5px solid "+(cp?"#86EFAC":"#E2E8F0");
tc2.appendChild(div("tcard-lbl","RECEIVED"));
const v2 = div("tcard-val", fmt(paid));
v2.style.color = cp ? "#16A34A" : "#0EA5E9";
tc2.appendChild(v2);
if (paid > 0) tc2.appendChild(btn("clr-paid","✕",()=>{ paid=0; render(); }));
duo.appendChild(tc2);
body.appendChild(duo);

// Change box
const cb = div("chgbox "+(cp?"go":"wait"));
if (cp) {
  cb.appendChild(div("chg-cta","GIVE BACK TO CUSTOMER 💰"));
  cb.appendChild(div("chg-amt", fmt(c)));
} else {
  cb.appendChild(div("chg-hint","Add money below to calculate change ↓"));
}
body.appendChild(cb);

// Bills
body.appendChild(div("mlbl","💵 BILLS"));
const bg = div("mgrid");
for (const b of BILLS) {
  const mb = document.createElement("button");
  mb.className = "mbtn bill";
  mb.innerHTML = '<span class="mico">💵</span><span class="mval-b">'+b.l+'</span>';
  mb.addEventListener("click",()=>{ paid=Math.round((paid+b.v)*100)/100; render(); });
  bg.appendChild(mb);
}
body.appendChild(bg);

// Coins
body.appendChild(div("mlbl","🪙 COINS"));
const cg = div("mgrid");
for (const c2 of COINS) {
  const mb = document.createElement("button");
  mb.className = "mbtn coin";
  mb.innerHTML = '<span class="mico">🪙</span><span class="mval-c">'+c2.l+'</span>';
  mb.addEventListener("click",()=>{ paid=Math.round((paid+c2.v)*100)/100; render(); });
  cg.appendChild(mb);
}
body.appendChild(cg);

const db = btn("done-btn "+(cp?"on":"off"),"✅ Complete Sale!", ()=>{
  if (!cp) return;
  sales = [{ id:Date.now(), items:[...cart], total:t, paid, change:c, time:new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}) }, ...sales];
  screen="receipt"; render();
});
body.appendChild(db);
app.appendChild(body);
```

}

function buildReceipt(app) {
const s = sales[0];
const wrap = div(“rcpt-wrap”);
wrap.appendChild(div(“rcpt-icon”,“🎉”));
wrap.appendChild(div(“rcpt-title”,“Sale Complete!”));
wrap.appendChild(div(“rcpt-sub”,“Thank you so much!”));

```
const card = div("rcpt-card");
card.appendChild(div("rcpt-stripe",""));
card.appendChild(div("rcpt-shop","LALA'S REGISTER"));
card.appendChild(div("rcpt-time", s.time));
for (const i of s.items) {
  const row = div("rcpt-row");
  row.appendChild(span("",i.emoji+" "+i.name+" x"+i.qty));
  const rv = span("",fmt(i.price*i.qty)); rv.style.fontWeight="700"; row.appendChild(rv);
  card.appendChild(row);
}
const tr = div("rcpt-tot");
tr.appendChild(span("","TOTAL")); const tv=span("",fmt(s.total)); tv.style.color="#F97316"; tr.appendChild(tv);
card.appendChild(tr);
const pr = div("rcpt-paid");
pr.appendChild(span("","Paid")); pr.appendChild(span("",fmt(s.paid)));
card.appendChild(pr);
const cr = div("rcpt-chg");

card.appendChild(cr);
wrap.appendChild(card);

wrap.appendChild(btn("new-btn","🛒 New Sale",()=>{ cart=[]; paid=0; screen="shop"; render(); }));

app.appendChild(wrap);
```

}

function buildSales(app) {
buildTopBar(app, “📊 Sales Report”, ()=>{ salesOpen=false; render(); });
const wrap = div(“sales-wrap”);
const totalEarned = sales.reduce((s,x)=>s+x.total,0);

```
const stats = div("stats-row");
const sc1=div("stat-card"); const sv1=div("stat-val",String(sales.length)); sv1.style.color="#0EA5E9"; sc1.appendChild(sv1); sc1.appendChild(div("stat-lbl","Transactions")); stats.appendChild(sc1);
const sc2=div("stat-card"); const sv2=div("stat-val",fmt(totalEarned)); sv2.style.color="#16A34A"; sc2.appendChild(sv2); sc2.appendChild(div("stat-lbl","Total Earned")); stats.appendChild(sc2);
wrap.appendChild(stats);

const list = div("sales-list");
if (sales.length===0) {
  list.appendChild(div("no-sales","No sales yet! Start selling 🎉"));
} else {
  sales.forEach((sale,idx)=>{
    const card=div("sale-card");
    const hdr=div("sale-hdr");
    hdr.appendChild(div("sale-badge","Sale #"+(sales.length-idx)));
    hdr.appendChild(div("sale-time",sale.time));
    card.appendChild(hdr);
